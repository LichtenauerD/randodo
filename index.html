<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Randodo</title>
  <meta name="theme-color" content="#173B2F">
  <meta name="description" content="Choisir une randonnée simplement, puis la suivre sans réseau.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Randodo">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="Carte des lieux de randonnée"></div>

  <header id="top">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
      <input id="search" type="search" placeholder="Chercher un lac, un sommet, un village" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="btn-filter" class="pill" type="button" aria-label="Régler mon envie"><span id="filter-label">Mon envie</span></button>
    </div>
    <ul id="results" hidden></ul>
    <div id="status" hidden></div>
  </header>

  <div id="fabs">
    <button id="btn-layer" class="fab" type="button" aria-label="Changer de fond de carte">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button id="btn-locate" class="fab" type="button" aria-label="Me situer sur la carte">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>

  <section id="sheet" class="sheet" hidden aria-live="polite"></section>
  <section id="hud" hidden></section>

  <main id="page" class="page" hidden></main>

  <nav id="tabs">
    <button data-tab="accueil" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Accueil</span></button>
    <button data-tab="carte" type="button"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>Carte</span></button>
    <button data-tab="objectifs" type="button"><svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 4h11l-2 3.5 2 3.5H5"/><path d="M3 21h6"/></svg><span>Conquête</span></button>
    <button data-tab="traces" type="button"><svg viewBox="0 0 24 24"><path d="M5 19c2-6 4-2 6-7s4-3 8-8"/><circle cx="5" cy="19" r="1.8"/><circle cx="19" cy="4" r="1.8"/></svg><span>Traces</span></button>
    <button data-tab="historique" type="button"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 012 2v16l-7-3.5L5 21V4a1 1 0 011-1z"/></svg><span>Historique</span></button>
    <button data-tab="reglages" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Réglages</span></button>
  </nav>

  <div id="modal" hidden></div>
  <div id="toast" role="status"></div>
  <input id="gpx-file" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
