name: Photos candidates
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Lieux à traiter (vide : tous)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Téléchargement des candidates
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: node tools/photos.mjs
      - name: Publication sur la branche photo-candidates (hors site)
        run: |
          git config user.name "randodo-bot"
          git config user.email "randodo-bot@users.noreply.github.com"
          git checkout --orphan photo-candidates
          git rm -rq --cached . 
          git add -f photo-candidates
          git commit -qm "Photos candidates du $(date +%F)"
          git push -f origin photo-candidates
