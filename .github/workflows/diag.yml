name: Diagnostic réseau
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script de tools/ à lancer'
        required: false
        default: 'diag-links.mjs'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/${{ github.event.inputs.script || 'diag-links.mjs' }}
