name: Notoriété des lieux
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 1 * *'
permissions:
  contents: write
jobs:
  pop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/popularity.mjs
      - name: Enregistrement
        run: |
          git config user.name "randodo-bot"
          git config user.email "randodo-bot@users.noreply.github.com"
          git add data/popularity.js
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Notoriété des lieux du $(date +%F)"
          git pull --rebase -q
          git push
