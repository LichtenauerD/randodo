name: Randos précalculées

on:
  schedule:
    - cron: '17 2 * * 1'   # chaque lundi vers 3 h 17 (heure de Paris en hiver)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: randos
  cancel-in-progress: false

jobs:
  calcul:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calcul des randos des lieux du catalogue
        run: node tools/precompute.mjs
      - name: Enregistrement
        run: |
          git config user.name "randodo-bot"
          git config user.email "randodo-bot@users.noreply.github.com"
          git add data/hikes
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Randos précalculées du $(date +%F)"
          git pull --rebase -q
          git push
