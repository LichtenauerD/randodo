name: Randos précalculées

on:
  schedule:
    - cron: '17 2 * * 0'   # chaque dimanche vers 3 h 17 (heure de Paris en hiver) ; seul le dernier du mois calcule
  workflow_dispatch:
    inputs:
      only:
        description: 'Noms de lieux à calculer, séparés par des virgules (vide : tous)'
        required: false
        default: ''
      limit:
        description: 'Nombre maximal de lieux (vide : pas de limite)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: randos
  cancel-in-progress: false

jobs:
  # Le planning se réveille chaque dimanche ; on ne calcule que le dernier dimanche du mois.
  date:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
    steps:
      - id: d
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u -d '+7 days' +%m)" != "$(date -u +%m)" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Pas le dernier dimanche du mois."; echo "go=0" >> "$GITHUB_OUTPUT"; fi
  calcul:
    needs: date
    if: needs.date.outputs.go == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils
        run: npm install --prefix tools --no-audit --no-fund
      - name: Modèle de terrain (cache)
        uses: actions/cache@v4
        with:
          path: dem
          key: dem-copernicus-glo30-v1
      - name: Calcul des randos des lieux du catalogue
        env:
          ONLY: ${{ github.event.inputs.only }}
          LIMIT: ${{ github.event.inputs.limit }}
          SAVE_EVERY: 8
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          git config user.name "randodo-bot"
          git config user.email "randodo-bot@users.noreply.github.com"
          node tools/precompute.mjs
      - name: Enregistrement
        if: always()
        run: |
          git config user.name "randodo-bot"
          git config user.email "randodo-bot@users.noreply.github.com"
          git add data/hikes
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Randos précalculées du $(date +%F)"
          git pull --rebase -q
          git push
